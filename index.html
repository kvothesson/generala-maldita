<h1>Generala maldita</h1>
<p>Generala maldita es un roguelike de dados en pixel art que se juega gratis en el navegador, en la compu o en el celu. Jugás a la generala contra el Mandinga en una pulpería de madrugada: son ocho mesas y cada una tiene una meta de puntos. Entre mesa y mesa comprás estampitas de santos y aparecidos, pegás caras nuevas en tus dados y, si te animás, firmás pactos con el diablo.</p>
<h2>Cómo se juega</h2>
<p>Tirás los dados con el botón TIRAR o la barra espaciadora y tenés 3 tiros por turno. Con un clic fijás un dado. Después anotás la jugada en una fila de la libreta, que te muestra cuánto daría. El puntaje es puntos por multiplicador y las estampitas se resuelven de izquierda a derecha, así que conviene sumar antes de multiplicar. Con M apagás el sonido y con F ponés pantalla completa. En el celu se juega de costado.</p>
<p>Es un juego de <a href="https://kvothesson.com/">Kvothesson</a>, del Universo Austral. Gratis, sin cuenta y sin instalar nada.</p>
<p class="aviso">Para jugar hace falta tener JavaScript activado.</p>

<script>
'use strict';
// Generala maldita: prototipo jugable. Las reglas viven en reglas.js; acá va la pantalla.
// Lienzo de 320x180 agrandado en enteros. Fondos y estampitas salen de arte/hoja.py; dados, letra e interfaz se dibujan acá.
const R = Reglas;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 320, H = 180;
const P = { tinta: '#0d0a0c', m0: '#1c1210', m1: '#2e1c14', m2: '#472b1a', m3: '#6b4424', m4: '#8f6233', m5: '#b88748',
  a0: '#e8a33a', a1: '#ffd27a', a2: '#fff1c4', v0: '#0f2a22', v1: '#1c4a38', v2: '#2f7a55',
  h0: '#6b5a47', h1: '#a08c6a', h2: '#d4c39c', h3: '#f2e8cf', r0: '#2a0c10', r1: '#5a1218', r2: '#9c1f22', r3: '#d93a2e',
  o0: '#8a6420', o1: '#c9962b', o2: '#f4cf5a', c0: '#1d4257', c1: '#2e6f8a', c2: '#6fb7c9', blanco: '#ffffff' };
const NOMBRE = { unos: 'UNOS', doses: 'DOSES', treses: 'TRESES', cuatros: 'CUATROS', cincos: 'CINCOS', seises: 'SEISES', escalera: 'ESCALERA', full: 'FULL', poker: 'POKER', generala: 'GENERALA' };
const MUDO = new URLSearchParams(location.search).has('mudo');
let LETRA = {}, ORDEN = [], IMG = {};
let G = null, T = null, S = null;
let Z = [], raton = { x: -1, y: -1 }, cuadro = 0;

// ---------------- dibujo base ----------------
function rect(x, y, w, h, c) { if (w > 0 && h > 0) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); } }
function rrect(x, y, w, h, c, r) {
  r = r || 1;
  rect(x + r, y, w - 2 * r, h, c); rect(x, y + r, w, h - 2 * r, c);
  if (r === 2) { rect(x + 1, y + 1, 1, 1, c); rect(x + w - 2, y + 1, 1, 1, c); rect(x + 1, y + h - 2, 1, 1, c); rect(x + w - 2, y + h - 2, 1, 1, c); }
}
const ACC = { 'Á': 'A', 'É': 'E', 'Í': 'I', 'Ó': 'O', 'Ú': 'U', 'Ñ': 'N' };
const ancho = (s, e) => (String(s).length * 6 - 1) * (e || 1);
function letras(x, y, s, c, e) {
  g.fillStyle = c;
  let cx = x;
  for (const ch of s) {
    const f = LETRA[ACC[ch] || ch] || LETRA['?'];
    for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++) if (f[j][i] === '1') g.fillRect(cx + i * e, y + j * e, e, e);
    if (ACC[ch]) for (const [i, j] of (ch === 'Ñ' ? [[1, -2], [2, -3], [3, -2], [4, -3]] : [[2, -2], [3, -3]])) g.fillRect(cx + i * e, y + j * e, e, e);
    cx += 6 * e;
  }
}
function texto(x, y, s, c, o) {
  o = o || {};
  s = String(s).toUpperCase();
  const e = o.e || 1;
  x = Math.round(x); y = Math.round(y);
  if (o.centro) x -= Math.floor(ancho(s, e) / 2);
  if (o.der) x -= ancho(s, e);
  if (o.borde) for (let dx = -1; dx <= e; dx++) for (let dy = -1; dy <= e; dy++) if (dx || dy) letras(x + dx, y + dy, s, o.borde, e);
  if (o.sombra) letras(x, y + e, s, o.sombra, e);
  letras(x, y, s, c, e);
}
const fmt = (n) => Math.round(n).toLocaleString('es-AR');
const fmtM = (m) => (m >= 100 ? fmt(m) : String(Math.round(m * 10) / 10).replace('.', ','));
function corto(n, max) {
  const k = Math.round(n / 1000) + 'K', m1 = String(Math.round(n / 100000) / 10).replace('.', ',') + 'M', m = Math.round(n / 1e6) + 'M';
  for (const s of [fmt(n), k, m1, m]) if (s.length <= max) return s;
  return '+'.repeat(max);
}
function zona(x, y, w, h, o) { Z.push(Object.assign({ x, y, w, h }, o)); }
const dentro = (z) => raton.x >= z.x && raton.x < z.x + z.w && raton.y >= z.y && raton.y < z.y + z.h;

// ---------------- sonido ----------------
let AC = null;
function son(f, d, tipo, v) {
  if (MUDO || G.mudo) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), ga = AC.createGain();
    o.type = tipo || 'square'; o.frequency.value = f;
    ga.gain.value = v || 0.04; ga.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (d || 0.07));
    o.connect(ga); ga.connect(AC.destination); o.start(); o.stop(AC.currentTime + (d || 0.07));
  } catch (e) { /* sin audio */ }
}

// ---------------- dados ----------------
const PIPS = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
const TIPO = {   // cara, luz, canto, canto oscuro, punto, brillo
  lisa: ['h3', 'a2', 'h2', 'h1', 'm1', 'a2'], maldita: ['r2', 'r3', 'r1', 'r0', 'h3', 'r1'], hielo: ['c2', 'a2', 'c1', 'c0', 'c0', 'a2'],
  dorada: ['o2', 'a2', 'o1', 'o0', 'm1', 'a2'], brasa: ['a0', 'a1', 'o0', 'r1', 'r0', 'a1'], semilla: ['v2', 'c2', 'v1', 'v0', 'a2', 'v1'],
  contagiosa: ['v1', 'v2', 'v0', 'tinta', 'a1', 'v0'], cargada: ['h0', 'h1', 'm2', 'm1', 'tinta', 'h1'], espejo: ['h1', 'blanco', 'h0', 'm2', 'blanco', 'h0'],
  hueso: ['h2', 'h3', 'h1', 'h0', 'm1', 'h3'], comodin: ['h3', 'a2', 'h2', 'h1', 'o1', 'a2'], inquieta: ['h3', 'a2', 'h2', 'h1', 'c1', 'a2'], doble: ['h3', 'a2', 'h2', 'h1', 'm1', 'a2'],
};
const PRIORIDAD = ['maldita', 'hielo', 'dorada', 'brasa', 'semilla', 'contagiosa', 'cargada', 'espejo', 'hueso', 'comodin', 'inquieta', 'doble'];
const tipoDe = (p) => PRIORIDAD.find((x) => p.includes(x)) || 'lisa';

function dado(x, y, valor, p, o) {
  o = o || {};
  let [cara, luz, c1, c2, punto, brillo] = TIPO[tipoDe(p)].map((k) => P[k]);
  if (o.apagado) { cara = P.h1; luz = P.h1; c1 = P.h0; c2 = P.m1; punto = P.m2; brillo = P.h1; }
  const alto = o.sinCanto ? 28 : 33;
  if (o.fijo) rrect(x - 1, y - 1, 30, alto + 2, P.o1, 2);
  rrect(x, y, 28, alto, o.fijo ? P.o2 : P.tinta, 2);
  if (!o.sinCanto) { rrect(x + 1, y + 20, 26, 12, c1, 2); rect(x + 2, y + 30, 24, 1, c2); rect(x + 3, y + 31, 22, 1, c2); }
  rrect(x + 1, y + 1, 26, 26, cara, 2);
  rect(x + 3, y + 1, 22, 1, luz); rect(x + 1, y + 3, 1, 22, luz); rect(x + 3, y + 26, 22, 1, c1);
  if (p.includes('doble')) { rect(x + 3, y + 3, 22, 1, c1); rect(x + 3, y + 24, 22, 1, c1); rect(x + 3, y + 3, 1, 22, c1); rect(x + 24, y + 3, 1, 22, c1); }
  if (p.includes('espejo')) for (let k = 0; k < 8; k++) rect(x + 16 + k, y + 10 - k, 1, 1, P.blanco);
  for (const [i, j] of PIPS[valor]) {
    const px = x + 5 + i * 7, py = y + 5 + j * 7;
    rect(px + 1, py + 4, 3, 1, brillo); rect(px + 4, py + 1, 1, 3, brillo);
    rrect(px, py, 4, 4, punto, 1);
  }
  if (p.includes('comodin')) { rect(x + 21, y + 3, 1, 3, P.o1); rect(x + 20, y + 4, 3, 1, P.o1); rect(x + 21, y + 4, 1, 1, P.a2); }
  if (o.tachado) for (let k = 0; k < 22; k++) rect(x + 3 + k, y + 3 + k, 2, 1, P.r3);
}
function carita(x, y, cara, o) {
  o = o || {};
  const t = TIPO[tipoDe(cara.p)].map((k) => P[k]);
  rrect(x, y, 16, 16, o.borde || P.tinta, 1);
  rrect(x + 1, y + 1, 14, 14, t[0], 1); rect(x + 2, y + 1, 12, 1, t[1]); rect(x + 2, y + 14, 12, 1, t[2]);
  for (const [i, j] of PIPS[cara.v]) rect(x + 3 + i * 4, y + 3 + j * 4, 2, 2, t[4]);
  if (cara.p.includes('comodin')) rect(x + 12, y + 2, 2, 2, P.o1);
  if (cara.p.includes('doble')) { rect(x + 2, y + 2, 12, 1, t[2]); rect(x + 2, y + 13, 12, 1, t[2]); }
}
function estampita(x, y, id, o) {
  o = o || {};
  if (o.elegida) rrect(x - 2, y - 2, 24, 32, P.a2, 2);
  g.drawImage(IMG.estampitas, ORDEN.indexOf(id) * 20, 0, 20, 28, Math.round(x), Math.round(y), 20, 28);
  if (o.copia) { rect(x + 14, y + 1, 5, 5, P.tinta); rect(x + 15, y + 2, 3, 3, P.r3); }
}
function hueco(x, y) {
  for (let i = 0; i < 20; i += 3) { rect(x + i, y, 2, 1, P.m3); rect(x + i, y + 27, 2, 1, P.m3); }
  for (let j = 0; j < 28; j += 3) { rect(x, y + j, 1, 2, P.m3); rect(x + 19, y + j, 1, 2, P.m3); }
}
function boton(x, y, w, h, s, estilo, o) {
  o = o || {};
  const E = { ambar: ['a0', 'a1', 'o0', 'tinta'], verde: ['v2', 'c2', 'v1', 'a2'], rojo: ['r2', 'r3', 'r1', 'a2'], apagado: ['m3', 'm4', 'm2', 'm1'] }[o.clic ? estilo : 'apagado'];
  const z = { x, y, w, h };
  const hundido = o.clic && dentro(z) && raton.abajo ? 1 : 0;
  rrect(x, y, w, h, P.tinta, 2); rrect(x + 1, y + 1, w - 2, h - 2, P[E[2]], 2);
  rrect(x + 1, y + 1 + hundido, w - 2, h - 4, P[o.clic && dentro(z) ? E[1] : E[0]], 2); rect(x + 3, y + 1 + hundido, w - 6, 1, P[E[1]]);
  texto(x + Math.floor(w / 2) + (o.dx || 0), y + Math.floor((h - 10) / 2) + 1 + hundido, s, P[E[3]], { centro: true });
  if (o.clic) zona(x, y, w, h, { clic: o.clic, tip: o.tip });
}
function moneda(x, y) { rrect(x, y, 7, 7, P.tinta, 2); rrect(x + 1, y + 1, 5, 5, P.o1, 1); rect(x + 2, y + 1, 2, 1, P.a2); rect(x + 3, y + 2, 1, 3, P.o0); }
function plataArriba(y) { const s = fmt(S.plata); moneda(W - 6 - ancho(s) - 10, y); texto(W - 5, y, s, S.plata < 0 ? P.r3 : P.o2, { der: true, borde: P.tinta }); }
function panel(x, y, w, h) { rrect(x, y, w, h, P.tinta, 2); rrect(x + 1, y + 1, w - 2, h - 2, P.o1, 2); rrect(x + 2, y + 2, w - 4, h - 4, P.m0, 1); }

// luz del farol que crece con el multiplicador: halo en escalones tramados, guardado por nivel
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const HALOS = {};
function halo(nivel) {
  if (HALOS[nivel]) return HALOS[nivel];
  const r = 30 + nivel * 14, c = document.createElement('canvas');
  c.width = c.height = r * 2;
  const h = c.getContext('2d');
  for (let y = 0; y < r * 2; y++) for (let x = 0; x < r * 2; x++) {
    const k = Math.floor(Math.max(0, 1 - Math.hypot(x - r, y - r) / r) * 4 + BAYER[y % 4][x % 4] / 16);
    if (k > 0) { h.fillStyle = 'rgba(232,163,58,' + (0.07 * k) + ')'; h.fillRect(x, y, 1, 1); }
  }
  c.r = r;
  return (HALOS[nivel] = c);
}

// ---------------- métricas (anónimas; en local no se mandan salvo con ?metricas) ----------------
const METRICAS_URL = 'https://generala-metricas.kvothesson.workers.dev/evento';
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && !new URLSearchParams(location.search).has('metricas');
const JUGADOR = (() => { try { let id = localStorage.getItem('generala.id'); if (!id) { id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('generala.id', id); } return id; } catch (e) { return 'anon'; } })();
function metrica(ev, extra) {
  if (!METRICAS_URL || LOCAL) return;
  const body = JSON.stringify({ ev, id: JUGADOR, seg: G && G.t0 ? Math.round((performance.now() - G.t0) / 1000) : 0, mesa: G && G.mesa != null ? G.mesa + 1 : 0,
    puntos: G ? Math.round(G.mejor || 0) : 0, movil: innerWidth < 760 || matchMedia('(pointer: coarse)').matches ? 1 : 0, extra: extra == null ? '' : String(extra) });
  try { if (navigator.sendBeacon) navigator.sendBeacon(METRICAS_URL, new Blob([body], { type: 'text/plain' })); else fetch(METRICAS_URL, { method: 'POST', body, keepalive: true }); } catch (e) { /* sin red */ }
}
setInterval(() => { if (G && G.t0 && !document.hidden && ['mesa', 'tienda', 'pacto'].includes(G.pantalla)) metrica('pulso'); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.t0 && G.pantalla !== 'titulo') metrica('salida'); });

// ---------------- partida ----------------
function nuevaPartida() {
  S = R.nuevoEstado();
  G = Object.assign(G || {}, { pantalla: 'mesa', mesa: 0, mejor: 0, flot: [], chispas: [], popDado: [], popEst: [], sel: null, pegar: null, verDados: false, anim: null, luz: 0, tiembla: 0 });
  G.t0 = performance.now();
  G.partidas = (G.partidas || 0) + 1;
  metrica('inicio', G.partidas);
  empezarMesa();
}
function empezarMesa() {
  Object.assign(G, { pantalla: 'mesa', puntos: 0, puntosVis: 0, usadas: {}, anot: 0, anotMax: R.anotaciones(S), meta: R.metaDe(S, G.mesa), jefe: R.JEFES[G.mesa] || null,
    facon: R.cuenta(S).facon, numeros: 0, sobrantes: 0, llamas: false, sel: null, espera: 0 });
  empezarTurno();
}
function empezarTurno() {
  G.armada = null;
  const nd = R.cuantosDados(S);
  const antes = T && T.nd === nd ? T.caras : null;
  T = { nd, caras: [], vals: [], fijos: [], rod: [], tiros: R.tirosDelTurno(S, G.anot === 0, G.jefe && G.jefe.id), usados: 0, fp: null, pombero: false, modoPombero: false, inquieta: false, giros: 6, previa: null };
  for (let i = 0; i < nd; i++) { T.caras.push(antes ? antes[i] : S.dados[i][5]); T.vals.push(T.caras[i].v); T.fijos.push(false); T.rod.push(0); }
}
const rodando = () => T.rod.some((r) => r > 0);
const ocupado = () => !!G.anim || rodando() || G.espera > 0;
function contexto() {
  return { sobran: T.tiros - T.usados, servida: T.usados === 1, fijados: T.fp === null ? T.nd : T.fp, ultima: G.anot === G.anotMax - 1, numeros: G.numeros, jefe: G.jefe && G.jefe.id };
}
function previa() { return T.previa || (T.previa = R.vistaPrevia(S, T.vals, T.caras, contexto())); }
function inquietas() { return !T.inquieta && T.usados > 0 ? T.caras.map((c, i) => (!T.fijos[i] && c.p.includes('inquieta') ? i : -1)).filter((i) => i >= 0) : []; }
function puedeTirar() {
  if (ocupado()) return false;
  if (T.usados === 0) return true;
  if (T.usados < T.tiros) return T.fijos.some((f) => !f);
  return inquietas().length > 0;
}
function tirarDados() {
  if (!puedeTirar()) return;
  const n = R.cuenta(S);
  let cuales, gratis = false;
  if (T.usados === 0) cuales = T.vals.map((_, i) => i);
  else if (T.usados < T.tiros) {
    cuales = T.fijos.map((f, i) => (f ? -1 : i)).filter((i) => i >= 0);
    const fijados = T.nd - cuales.length;
    if (T.fp === null) T.fp = fijados;
    if (fijados === 0 && n.almamula) {
      S.almamula += 2 * (R.familias(S).A ? 2 : 1) * n.almamula;
      R.efectivas(S).filter((e) => e.id === 'almamula').forEach((e) => { G.popEst[e.k] = 10; flotar(16 + e.k * 23, 140, '+MULT', P.a1); });
    }
  } else { cuales = inquietas(); T.inquieta = true; gratis = true; }

  boton(252, 18, 62, 13, costo ? 'CAMBIAR ' + costo : 'CAMBIAR', 'ambar', { clic: S.plata - costo >= pisoPlata() ? () => { S.plata -= costo; G.of = R.oferta(S, Math.random); G.sel = null; son(240, 0.1, 'sawtooth'); } : null });
  boton(190, 18, 58, 13, 'VER DADOS', 'verde', { clic: () => { G.verDados = true; } });
}

// ---------------- pantalla: pacto ----------------
function pantallaPacto() {
  g.drawImage(IMG.fondo_jefe, 0, 0);
  rect(0, 139, W, 41, P.tinta);
  texto(160, 44, 'EL MANDINGA TE OFRECE UN PACTO', P.a2, { centro: true, borde: P.tinta });
  G.pactos.forEach((id, i) => {
    const x = 20 + i * 148, e = R.ESTAMPITAS[id], sel = G.sel && G.sel.id === id;
    panel(x, 56, 132, 74);
    if (sel) { rect(x + 2, 58, 128, 1, P.a2); rect(x + 2, 127, 128, 1, P.a2); }
    texto(x + 8, 61, e.nombre, P.o2);
    estampita(x + 8, 72, id, { elegida: sel });
    partir(e.desc, 15).forEach((l, k) => texto(x + 36, 73 + k * 9, l, P.h2));
    partir('COBRA: ' + e.cobra, 19).forEach((l, k) => texto(x + 8, 101 + k * 9, l, P.r3));
    zona(x, 56, 132, 74, { clic: () => { G.sel = sel ? null : { donde: 'pacto', id }; son(200, 0.1, 'sawtooth'); } });
  });
  const lleno = S.tengo.length >= 5;
  if (lleno) texto(160, 134, 'NO TENÉS LUGAR PARA OTRA ESTAMPITA', P.r3, { centro: true, borde: P.tinta });
  boton(70, 150, 84, 18, 'FIRMAR', 'rojo', { clic: G.sel && !lleno ? () => { S.tengo.push(G.sel.id); metrica('pacto', G.sel.id); G.sel = null; son(70, 0.6, 'sawtooth', 0.07); G.mesa++; empezarMesa(); } : null });
  boton(166, 150, 84, 18, 'RECHAZAR', 'verde', { clic: () => { metrica('pacto', 'rechazo'); G.sel = null; G.mesa++; empezarMesa(); } });
}
function partir(s, max) {
  const out = [];
  let l = '';
  s.split(' ').forEach((p) => { if ((l + ' ' + p).trim().length > max) { out.push(l); l = p; } else l = (l + ' ' + p).trim(); });
  if (l) out.push(l);
  return out;
}

// ---------------- carteles ----------------
function cartel(titulo, color, lineas, btn, clic) {
  rect(0, 0, W, H, 'rgba(13,10,12,0.72)');
  const h = 58 + lineas.length * 10;
  const y = Math.floor((H - h) / 2);
  panel(60, y, 200, h);
  texto(160, y + 10, titulo, color, { centro: true, e: ancho(titulo, 2) <= 190 ? 2 : 1, sombra: P.tinta });
  lineas.forEach((l, k) => {
    if (Array.isArray(l)) { texto(74, y + 32 + k * 10, l[0], P.h2); texto(246, y + 32 + k * 10, (l[1] > 0 ? '+' : '') + l[1], l[1] > 0 ? P.o2 : P.r3, { der: true }); }
    else texto(160, y + 32 + k * 10, l, P.h2, { centro: true });
  });
  boton(110, y + h - 22, 100, 16, btn, 'ambar', { clic });
}
function tapaDados() {
  rect(0, 0, W, H, 'rgba(13,10,12,0.8)');
  panel(40, 8, 240, 164);
  const pg = G.pegar;
  texto(160, 14, pg ? 'PEGÁ ' + R.CARAS[pg.id].nombre + ': FALTAN ' + pg.quedan : 'TUS DADOS', P.o2, { centro: true });
  const nd = R.cuantosDados(S), x0 = 160 - Math.floor((nd * 26 - 10) / 2);
  for (let d = 0; d < nd; d++) {
    texto(x0 + d * 26 + 8, 26, String(d + 1), P.h1, { centro: true });
    for (let f = 0; f < 6; f++) {
      const cara = S.dados[d][f], x = x0 + d * 26, y = 36 + f * 18, z = { x, y, w: 16, h: 16 };
      const vale = pg && !cara.p.includes(pg.id) && !(pg.id === 'espejo' && d === 0) && !(pg.id === 'contagiosa' && d === nd - 1);
      carita(x, y, cara, { borde: pg && vale && dentro(z) ? P.a2 : P.tinta });
      if (pg && !vale) rect(x, y, 16, 16, 'rgba(13,10,12,0.6)');
      zona(x, y, 16, 16, { clic: vale ? () => { R.pegarCara(S, pg.id, d, f + 1); pg.quedan--; son(600, 0.08, 'triangle'); if (!pg.quedan) G.pegar = null; if (T) T.previa = null; } : null, tip: tipCara(cara.p), fijo: true });
    }
  }
  const fam = R.familias(S), activas = Object.keys(fam).filter((k) => fam[k]).map((k) => R.FAMILIAS[k].nombre);
  texto(160, 147, activas.length ? activas.join(' · ') : 'JUNTÁ 3 ESTAMPITAS DE UNA FAMILIA', activas.length ? P.o2 : P.h0, { centro: true });
  if (!pg) boton(120, 155, 80, 14, 'CERRAR', 'verde', { clic: () => { G.verDados = false; } });
  else texto(160, 158, 'ELEGÍ UN LADO DE CUALQUIER DADO', P.h1, { centro: true });
}
// ---------------- pantalla completa ----------------
const PUEDE_COMPLETA = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const enCompleta = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function completa() {
  try {
    if (enCompleta()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const el = document.documentElement, pedir = el.requestFullscreen || el.webkitRequestFullscreen;
    const r = pedir.call(el, { navigationUI: 'hide' });
    const girar = () => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* no se puede trabar */ } };
    if (r && r.then) r.then(girar).catch(() => {}); else girar();
  } catch (e) { /* el navegador no deja */ }
}
function iconoCompleta(x, y) {
  if (!PUEDE_COMPLETA) return;
  const z = { x: x - 2, y: y - 2, w: 14, h: 14 }, c = dentro(z) ? P.a1 : P.m4, adentro = enCompleta();
  // cuatro esquinas en L: hacia afuera para entrar, hacia adentro para salir
  for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
    const cx = x + (sx > 0 ? 0 : 9) + (adentro ? sx * 3 : 0), cy = y + (sy > 0 ? 0 : 9) + (adentro ? sy * 3 : 0), d = adentro ? -1 : 1;
    for (let k = 0; k < 4; k++) { rect(cx + sx * k * d, cy, 1, 1, c); rect(cx, cy + sy * k * d, 1, 1, c); }
  }
  zona(z.x, z.y, z.w, z.h, { clic: completa, tip: { a: adentro ? 'SALIR DE PANTALLA COMPLETA' : 'PANTALLA COMPLETA', b: '', c: 'TECLA F' } });
}

function pantallaTitulo() {
  g.drawImage(IMG.fondo_mesa, 0, 0);
  rect(0, 139, W, 41, P.m0); rect(0, 139, W, 1, P.m4);
  texto(160, 50, 'GENERALA', P.a2, { centro: true, e: 3, sombra: P.o0, borde: P.tinta });
  texto(160, 78, 'MALDITA', P.r3, { centro: true, e: 3, sombra: P.r0, borde: P.tinta });
  texto(160, 108, 'OCHO MESAS CONTRA EL MANDINGA', P.h2, { centro: true, borde: P.tinta });
  texto(160, 119, 'FIJÁ DADOS, ANOTÁ JUGADAS, PASÁ LA META', P.h1, { centro: true, borde: P.tinta });
  boton(110, 150, 100, 18, 'JUGAR', 'ambar', { clic: nuevaPartida });
  texto(316, 170, G.mudo || MUDO ? 'M: SONIDO NO' : 'M: SONIDO SÍ', P.m3, { der: true });
  const z = { x: 2, y: 166, w: ancho('KVOTHESSON.COM') + 4, h: 12 };
  texto(4, 170, 'KVOTHESSON.COM', dentro(z) ? P.a1 : P.m4);
  zona(z.x, z.y, z.w, z.h, { clic: () => { location.href = 'https://kvothesson.com/'; } });
  const zs = { x: 316 - ancho('M: SONIDO SÍ') - 2, y: 166, w: ancho('M: SONIDO SÍ') + 4, h: 12 };
  zona(zs.x, zs.y, zs.w, zs.h, { clic: () => { G.mudo = !G.mudo; } });
  iconoCompleta(W - 15, 5);
}

// ---------------- bucle ----------------
function cartelito(t, z) {
  if (!t) return;
  const lineas = [[t.a, P.o2]];
  if (t.b) lineas.push([t.b, P.c2]);
  partir(t.c || '', 48).forEach((l) => lineas.push([l, P.h2]));
  if (t.d) lineas.push([t.d, P.r3]);
  const w = Math.max(...lineas.map((l) => ancho(l[0]))) + 10, h = lineas.length * 9 + 6;
  const x = Math.max(2, Math.min(W - w - 2, z.x + Math.floor(z.w / 2) - Math.floor(w / 2)));
  const y = z.y - h - 3 > 1 ? z.y - h - 3 : z.y + z.h + 3;
  rrect(x, y, w, h, P.tinta, 2); rrect(x + 1, y + 1, w - 2, h - 2, P.o1, 2); rrect(x + 2, y + 2, w - 4, h - 4, P.m0, 1);
  lineas.forEach((l, k) => texto(x + 5, y + 5 + k * 9, l[0], l[1]));
}
function pintar() {
  cuadro++;
  Z = [];
  g.setTransform(1, 0, 0, 1, OX, OY);
  if (G.tiembla > 0) { const d = [[1, 0], [-1, 1], [0, -1], [1, 1]][G.tiembla % 4]; g.translate(d[0], d[1]); G.tiembla--; }
  if (G.pantalla === 'titulo') pantallaTitulo();
  else if (G.pantalla === 'tienda') pantallaTienda();
  else if (G.pantalla === 'pacto') pantallaPacto();
  else pantallaMesa();
  if (G.pantalla !== 'titulo') {
    if (G.anim) pasoAnim();
    if (T) for (let i = 0; i < T.nd; i++) if (T.rod[i] > 0) { T.rod[i]--; if (T.rod[i] === 0) { son(200 + Math.random() * 60, 0.04, 'square', 0.05); T.previa = null; } }
    for (let k = 0; k < 6; k++) { if (G.popDado[k] > 0) G.popDado[k]--; if (G.popEst[k] > 0) G.popEst[k]--; }
    if (G.espera > 0 && --G.espera === 0 && G.despues) { const f = G.despues; G.despues = null; f(); }
    G.puntosVis += (G.puntos - G.puntosVis) * 0.18; if (Math.abs(G.puntos - G.puntosVis) < 1) G.puntosVis = G.puntos;
    G.chispas = G.chispas.filter((c) => { c.x += c.vx; c.y += c.vy; if (!c.llama) c.vy += 0.09; c.t--; const tam = c.t > 8 ? 2 : 1; rect(c.x, c.y, tam, tam, c.c); return c.t > 0; });
    G.flot = G.flot.filter((f) => { f.t++; texto(f.x, f.y - Math.floor(f.t / 3), f.s, f.c, { centro: true, borde: P.tinta, e: f.e }); return f.t < 34; });
  }
  if (G.pantalla === 'premio') cartel('MESA GANADA', P.o2, G.premio.concat(['TU PLATA: ' + S.plata]), 'A LA PULPERÍA', irTienda);
  if (G.pantalla === 'perdiste') cartel('TE GANÓ EL MANDINGA', P.r3, ['LLEGASTE A LA MESA ' + (G.mesa + 1), 'TE FALTARON ' + fmt(G.meta - G.puntos) + ' PUNTOS', 'TU MEJOR JUGADA: ' + fmt(G.mejor)], 'OTRA PARTIDA', nuevaPartida);
  if (G.pantalla === 'ganaste') cartel('LE GANASTE', P.o2, ['EL MANDINGA SE LEVANTA DE LA MESA', 'TU MEJOR JUGADA: ' + fmt(G.mejor)], 'OTRA PARTIDA', nuevaPartida);
  if (G.pantalla !== 'titulo' && (G.verDados || G.pegar)) { const fondo = Z.length; tapaDados(); Z = Z.slice(fondo); }
  else if (['premio', 'perdiste', 'ganaste'].includes(G.pantalla)) Z = Z.slice(-1);
  let sobre = null;
  for (const z of Z) if (dentro(z)) sobre = z;
  if (sobre && sobre.tip && !G.anim) cartelito(sobre.tip, sobre);
  cv.style.cursor = sobre && sobre.clic ? 'pointer' : 'default';
  extender();
}
function bucle() { pintar(); requestAnimationFrame(bucle); }
window.avanzar = (n) => { for (let k = 0; k < n; k++) pintar(); return window.estado(); };   // para probar sin esperar al reloj
// Llena la ventana. Si el factor entero queda muy chico, usa el fraccionario para no dejar bordes grandes.
// En un celu vertical el juego se gira 90° para jugar con el teléfono de costado.
let GIRADO = false;
// El juego vive en 320x180; el lienzo toma la forma de la pantalla y lo que sobra se cubre estirando
// los bordes del cuadro (la veta de la madera sigue, el techo y la baranda bajan): sin franjas negras.
let OX = 0, OY = 0, CW = W, CH = H, ESC = 1;
function ajustar() {
  const aw = innerWidth, ah = innerHeight, tactil = matchMedia('(pointer: coarse)').matches;
  GIRADO = tactil && ah > aw;
  const ancho = GIRADO ? ah : aw, alto = GIRADO ? aw : ah;
  const justo = Math.min(ancho / W, alto / H), entero = Math.floor(justo);
  ESC = entero >= 1 && entero / justo >= 0.92 ? entero : Math.max(1, justo);
  CW = Math.ceil(ancho / ESC); CH = Math.ceil(alto / ESC);
  OX = Math.floor((CW - W) / 2); OY = Math.floor((CH - H) / 2);
  if (cv.width !== CW || cv.height !== CH) { cv.width = CW; cv.height = CH; g.imageSmoothingEnabled = false; }
  cv.style.width = CW * ESC + 'px'; cv.style.height = CH * ESC + 'px';
  cv.classList.toggle('girado', GIRADO);
}
function extender() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  if (OX > 0) { g.drawImage(cv, OX, OY, 1, H, 0, OY, OX, H); g.drawImage(cv, OX + W - 1, OY, 1, H, OX + W, OY, CW - OX - W, H); }
  if (OY > 0) { g.drawImage(cv, 0, OY, CW, 1, 0, 0, CW, OY); g.drawImage(cv, 0, OY + H - 1, CW, 1, 0, OY + H, CW, CH - OY - H); }
}
function aLienzo(ev) {
  const r = cv.getBoundingClientRect();
  if (GIRADO) { raton.x = Math.floor((ev.clientY - r.top) * CW / r.height) - OX; raton.y = Math.floor((r.right - ev.clientX) * CH / r.width) - OY; }
  else { raton.x = Math.floor((ev.clientX - r.left) * CW / r.width) - OX; raton.y = Math.floor((ev.clientY - r.top) * CH / r.height) - OY; }
  G.tactil = ev.pointerType !== 'mouse';
}
cv.addEventListener('pointermove', aLienzo);
cv.addEventListener('pointerdown', (ev) => { aLienzo(ev); raton.abajo = true; });
cv.addEventListener('pointerup', (ev) => {
  aLienzo(ev); raton.abajo = false;
  let sobre = null;
  for (const z of Z) if (dentro(z)) sobre = z;
  if (sobre && sobre.clic) sobre.clic();
});
cv.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') { raton.x = raton.y = -1; } raton.abajo = false; });
addEventListener('keydown', (ev) => { if (ev.key === 'f' || ev.key === 'F') completa(); if (ev.key === 'm' || ev.key === 'M') G.mudo = !G.mudo; if (ev.key === ' ' && G.pantalla === 'mesa') tirarDados(); });
addEventListener('resize', ajustar);
addEventListener('orientationchange', () => setTimeout(ajustar, 200));
document.addEventListener('fullscreenchange', () => setTimeout(ajustar, 50));
document.addEventListener('contextmenu', (ev) => ev.preventDefault());

// Para revisar el estado sin mirar la pantalla.
window.estado = () => ({ pantalla: G.pantalla, mesa: G.mesa + 1, puntos: G.puntos, meta: G.meta, anot: G.anot + '/' + G.anotMax, plata: S && S.plata, tengo: S && S.tengo,
  dados: T && T.vals, fijos: T && T.fijos, tiros: T && (T.tiros - T.usados), anim: !!G.anim, zonas: Z.length });

function cargar(nombre) { return new Promise((ok, mal) => { const i = new Image(); i.onload = () => { IMG[nombre] = i; ok(); }; i.onerror = mal; i.src = nombre + '.png'; }); }
Promise.all([fetch('arte.json').then((r) => r.json()), cargar('fondo_mesa'), cargar('fondo_jefe'), cargar('fondo_tienda'), cargar('estampitas')]).then(([arte]) => {
  LETRA = arte.letra; ORDEN = arte.estampitas;
  G = { pantalla: 'titulo', mudo: false, flot: [], chispas: [], popDado: [], popEst: [], tiembla: 0 };
  ajustar();
  requestAnimationFrame(bucle);
});
</script>
